name: Native isolated CLI build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      STABLE_GIT_COMMIT: 6905ecede7816e91373e9eabda3f6b0368fc747b
      EXPECTED_PATCH_SHA256: d0cb44027e64296045dfa26dbc79ed878ee8b5feee325267640c6337b9c8e76e
      CARGO_BUILD_JOBS: 2
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - name: Check out pinned upstream Codex
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 6905ecede7816e91373e9eabda3f6b0368fc747b
          persist-credentials: false

      - name: Check out this repository for the reviewed patch
        uses: actions/checkout@v4
        with:
          path: router

      - name: Verify source and apply required custom patch
        shell: pwsh
        run: |
          $expected = '6905ecede7816e91373e9eabda3f6b0368fc747b'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Unexpected upstream revision: $actual (expected $expected)"
          }

          $patch = Join-Path $env:GITHUB_WORKSPACE 'router/patches/native-isolated-cli.patch'
          if (-not (Test-Path -LiteralPath $patch -PathType Leaf)) {
            Write-Error 'Required patch is missing: router/patches/native-isolated-cli.patch. Add the reviewed patch before running this workflow.'
            exit 1
          }
          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne $env:EXPECTED_PATCH_SHA256) {
            throw "Unexpected patch SHA-256: $patchHash (expected $env:EXPECTED_PATCH_SHA256)"
          }
          git apply --check -- $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply -- $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Verify Cargo package and binary targets
        shell: pwsh
        working-directory: codex-rs
        run: |
          $metadataText = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $metadataText | ConvertFrom-Json
          foreach ($packageName in @('codex-protocol', 'codex-core', 'codex-cli')) {
            if (-not ($metadata.packages | Where-Object { $_.name -eq $packageName })) {
              throw "Pinned source does not contain required package '$packageName'."
            }
          }
          $cliPackage = $metadata.packages | Where-Object { $_.name -eq 'codex-cli' } | Select-Object -First 1
          $codexBinary = $cliPackage.targets | Where-Object { $_.name -eq 'codex' -and $_.kind -contains 'bin' } | Select-Object -First 1
          if (-not $codexBinary) {
            throw "Pinned source package 'codex-cli' has no binary target named 'codex'; cargo build --locked --release --bin codex would not match."
          }
          $metadataPath = Join-Path $env:RUNNER_TEMP 'codex-cargo-metadata.json'
          [System.IO.File]::WriteAllText($metadataPath, ($metadataText -join "`n"), [System.Text.UTF8Encoding]::new($false))
          $lockReport = Join-Path $env:RUNNER_TEMP 'cargo-lock-normalization.json'
          $normalizer = Join-Path $env:GITHUB_WORKSPACE 'router/scripts/normalize-cargo-workspace-lock.mjs'
          node $normalizer --metadata $metadataPath --lockfile 'Cargo.lock' --report $lockReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Verified packages codex-protocol/codex-core and target codex in package codex-cli."

      - name: Restore Cargo dependencies and build cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target/debug
            codex-rs/target/release
          key: windows-rust-1.95-${{ env.STABLE_GIT_COMMIT }}-${{ hashFiles('router/patches/native-isolated-cli.patch', 'codex-rs/Cargo.lock') }}
          restore-keys: |
            windows-rust-1.95-${{ env.STABLE_GIT_COMMIT }}-
            windows-rust-1.95-

      - name: Restore legacy debug-only Cargo cache
        if: ${{ steps.cargo-cache.outputs.cache-matched-key == '' }}
        id: cargo-cache-legacy-debug
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target/debug
          key: windows-rust-1.95-${{ env.STABLE_GIT_COMMIT }}-${{ hashFiles('router/patches/native-isolated-cli.patch', 'codex-rs/Cargo.lock') }}
          restore-keys: |
            windows-rust-1.95-${{ env.STABLE_GIT_COMMIT }}-
            windows-rust-1.95-

      - name: Run Cargo.lock normalizer test
        shell: pwsh
        working-directory: codex-rs
        run: |
          $testPath = Join-Path $env:GITHUB_WORKSPACE 'router/tests/normalize-cargo-workspace-lock.test.mjs'
          node $testPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Responses WebSocket metadata tests
        shell: pwsh
        working-directory: codex-rs
        run: |
          $output = cargo test --locked -p codex-api endpoint::responses_websocket::tests --lib 2>&1
          $testExit = $LASTEXITCODE
          $outputText = $output | Out-String
          Write-Output $outputText
          if ($outputText -notmatch '(?m)^running [1-9]\d* tests?\r?$') {
            throw 'Expected Responses WebSocket unit tests to execute.'
          }
          if ($testExit -ne 0) { exit $testExit }

      - name: Run protocol wire-alias tests
        shell: pwsh
        working-directory: codex-rs
        run: |
          cargo test --locked -p codex-protocol sol_luna_wire_aliases --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run core native DeepSeek tests
        id: core-native-deepseek-tests
        shell: pwsh
        working-directory: codex-rs
        run: |
          $output = cargo test --locked -p codex-core native_deepseek --lib -- --skip native_api_ 2>&1
          $testExit = $LASTEXITCODE
          $outputText = $output | Out-String
          Write-Output $outputText
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "core-native-deepseek-tests-${env:GITHUB_RUN_ID}.log"
          [System.IO.File]::WriteAllText($diagnosticPath, $outputText, [System.Text.UTF8Encoding]::new($false))
          if ($testExit -ne 0) { exit $testExit }

      - name: Upload core native DeepSeek test diagnostics
        if: ${{ failure() && steps.core-native-deepseek-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-native-deepseek-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/core-native-deepseek-tests-${{ github.run_id }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Run native API profile tests
        id: native-api-profile-tests
        shell: pwsh
        working-directory: codex-rs
        run: |
          $output = cargo test --locked -p codex-core native_api --lib 2>&1
          $testExit = $LASTEXITCODE
          $outputText = $output | Out-String
          Write-Output $outputText
          $diagnosticPath = Join-Path $env:RUNNER_TEMP "native-api-tests-${env:GITHUB_RUN_ID}.log"
          [System.IO.File]::WriteAllText($diagnosticPath, $outputText, [System.Text.UTF8Encoding]::new($false))
          if ($outputText -notmatch '(?m)^running (\d+) tests?\r?$') {
            throw 'Expected the native API profile tests to report a test count.'
          }
          $count = [int]$matches[1]
          if ($count -ne 8) {
            throw "Expected 8 native API profile tests, ran $count."
          }
          if ($testExit -ne 0) { exit $testExit }

      - name: Upload native API test diagnostics
        if: ${{ failure() && steps.native-api-profile-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-api-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/native-api-tests-${{ github.run_id }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Run bounded retry role regression
        shell: pwsh
        working-directory: codex-rs
        run: |
          $output = cargo test --locked -p codex-core agent::role::tests::apply_role_can_disable_unbounded_connection_retries_without_changing_parent --lib -- --exact 2>&1
          $testExit = $LASTEXITCODE
          $outputText = $output | Out-String
          Write-Output $outputText
          if ($testExit -ne 0) { exit $testExit }
          if ($outputText -notmatch '(?m)^running 1 test\r?$') {
            throw 'Expected the bounded retry regression to run exactly one test.'
          }

      - name: Run native API main profile regression
        shell: pwsh
        working-directory: codex-rs
        run: |
          $output = cargo test --locked -p codex-core agent::native_deepseek::tests::native_api_profile_child_uses_owned_provider_and_catalog_without_changing_parent --lib -- --exact 2>&1
          $testExit = $LASTEXITCODE
          $outputText = $output | Out-String
          Write-Output $outputText
          if ($outputText -notmatch '(?m)^running 1 test\r?$') {
            throw 'Expected the native API profile regression to run exactly one test.'
          }
          if ($testExit -ne 0) { exit $testExit }

      - name: Build release CLI
        shell: pwsh
        working-directory: codex-rs
        run: |
          cargo build -p codex-cli --locked --release --bin codex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'target/release/codex.exe' -PathType Leaf)) {
            throw 'Cargo reported success but codex-rs/target/release/codex.exe is missing.'
          }

      - name: Save Cargo dependencies and build cache
        if: ${{ always() && !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target/debug
            codex-rs/target/release
          key: windows-rust-1.95-${{ env.STABLE_GIT_COMMIT }}-${{ hashFiles('router/patches/native-isolated-cli.patch', 'codex-rs/Cargo.lock') }}

      - name: Stage executable and provenance
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'native-isolated-cli-artifact'
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          Copy-Item -LiteralPath 'codex-rs/target/release/codex.exe' -Destination (Join-Path $artifact 'codex.exe')
          $binaryHash = (Get-FileHash -LiteralPath (Join-Path $artifact 'codex.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $lockReportPath = Join-Path $env:RUNNER_TEMP 'cargo-lock-normalization.json'
          if (-not (Test-Path -LiteralPath $lockReportPath -PathType Leaf)) { throw 'Cargo.lock normalization report is missing.' }
          Copy-Item -LiteralPath $lockReportPath -Destination (Join-Path $artifact 'cargo-lock-normalization.json')
          $lockAudit = Get-Content -LiteralPath $lockReportPath -Raw | ConvertFrom-Json

          foreach ($name in @('LICENSE', 'NOTICE')) {
            $source = Join-Path 'codex-rs' $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { $source = $name }
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $artifact $name)
            }
          }

          $patch = Join-Path $env:GITHUB_WORKSPACE 'router/patches/native-isolated-cli.patch'
          $patchHash = (Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = [ordered]@{
            source_repository = 'https://github.com/openai/codex'
            source_commit = $env:STABLE_GIT_COMMIT
            rust_toolchain = '1.95.0'
            target = 'x86_64-pc-windows-msvc'
            binary_sha256 = $binaryHash
            patch = 'router/patches/native-isolated-cli.patch'
            patch_sha256 = $patchHash
            cargo_lock_original_sha256 = $lockAudit.original_lock_sha256
            cargo_lock_sha256 = $lockAudit.normalized_lock_sha256
            cargo_lock_diff = $lockAudit.lock_diff
            tests = @('cargo test --locked -p codex-protocol sol_luna_wire_aliases --lib', 'cargo test --locked -p codex-core native_deepseek --lib -- --skip native_api_', 'cargo test --locked -p codex-core native_api --lib', 'cargo test --locked -p codex-core agent::role::tests::apply_role_can_disable_unbounded_connection_retries_without_changing_parent --lib -- --exact', 'cargo test --locked -p codex-core agent::native_deepseek::tests::native_api_profile_child_uses_owned_provider_and_catalog_without_changing_parent --lib -- --exact')
            build = 'cargo build -p codex-cli --locked --release --bin codex'
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $artifact 'provenance.json') -Encoding utf8

      - name: Upload custom CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-isolated-codex-windows-msvc-${{ github.run_id }}
          path: ${{ runner.temp }}/native-isolated-cli-artifact/*
          if-no-files-found: error
          retention-days: 14
